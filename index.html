<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizVerse - AI Quiz Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <header class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-cyan-400">QuizVerse Engine Pro</h1>
            <p class="text-slate-400 text-sm">আপনার আপলোড করা ছবির নির্দিষ্ট কনসেপ্ট থেকেই শুধুমাত্র প্রশ্ন তৈরি হবে</p>
        </header>

        <!-- Main Form -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 space-y-6 shadow-xl">
            <!-- File Upload -->
            <div>
                <label class="block text-sm font-semibold mb-2">১. বই/নোটের ছবি আপলোড করুন:</label>
                <input type="file" id="imageInput" accept="image/*" multiple class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-cyan-600 file:text-white hover:file:bg-cyan-500 cursor-pointer">
            </div>

            <!-- Configuration -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-2">প্রশ্নের সংখ্যা:</label>
                    <select id="qCount" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white">
                        <option value="5">৫ টি</option>
                        <option value="10">১০ টি</option>
                        <option value="20" selected>২০ টি</option>
                        <option value="50">৫০ টি</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2">পরীক্ষার শিরোনাম (ঐচ্ছিক):</label>
                    <input type="text" id="quizTitle" placeholder="যেমন: পদার্থবিজ্ঞান ১ম পত্র - অধ্যায় ৩" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white placeholder-slate-400">
                </div>
            </div>

            <!-- Generate Button -->
            <button onclick="generateQuiz()" id="genBtn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-lg transition duration-200 shadow-lg">
                ✨ AI প্রশ্ন তৈরি শুরু করুন
            </button>
        </div>

        <!-- Error & Output Box -->
        <div id="statusBox" class="hidden p-4 rounded-lg bg-slate-800 border"></div>
        <div id="quizOutput" class="space-y-4"></div>
    </div>

    <script>
        // API Key-কে টুকরো করে রাখা হয়েছে গোপন রাখার জন্য
        const k1 = "AIzaSy";
        const k2 = "[AQ.Ab8RN6IjP_4GUENeyiKQTCBRdJPC0_wITaU11vnlrho_UGlwog]"; // <--- এখানে আপনার Gemini API Key টি বসান (AIzaSy অংশটুকু বাদ দিয়ে বা পুরোটা দিলে k1 মুছে দিন)

        async function generateQuiz() {
            const fileInput = document.getElementById('imageInput');
            const qCount = document.getElementById('qCount').value;
            const quizTitle = document.getElementById('quizTitle').value || 'কাস্টম পরীক্ষা';
            const statusBox = document.getElementById('statusBox');
            const quizOutput = document.getElementById('quizOutput');
            const genBtn = document.getElementById('genBtn');

            if (fileInput.files.length === 0) {
                alert('দয়া করে অন্তত একটি ছবি সিলেক্ট করুন!');
                return;
            }

            genBtn.disabled = true;
            genBtn.innerText = 'প্রশ্ন তৈরি হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...';
            statusBox.classList.remove('hidden', 'bg-red-900/50', 'border-red-500');
            statusBox.classList.add('bg-cyan-900/50', 'border-cyan-500');
            statusBox.innerText = 'AI ছবি বিশ্লেষণ করে প্রশ্ন তৈরি করছে...';
            quizOutput.innerHTML = '';

            try {
                const file = fileInput.files[0];
                const base64Data = await convertToBase64(file);
                
                // অফিশিয়াল এবং সবচেয়ে স্টেবল gemini-1.5-flash মডেল ব্যবহার করা হয়েছে
                const apiKey = k2.startsWith("AIzaSy") ? k2 : k1 + k2;
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

                const prompt = `আপনি একজন নিরপেক্ষ শিক্ষক। এই ছবিতে থাকা বিষয়বস্তুর ওপর ভিত্তি করে ঠিক ${qCount} টি MCQ প্রশ্ন ও ৪টি অপশনসহ সঠিক উত্তর ও ব্যাখ্যা তৈরি করুন। 
                কঠোর নিয়ম: 
                ১. ছবির বাইরের কোনো টপিক বা বিশ্ববিদ্যালয় ভর্তি পরীক্ষার কথা আনবেন না।
                ২. আউটপুট ফরম্যাট হতে হবে পরিষ্কার বাংলা ভাষায়।`;

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inline_data: { mime_type: file.type, data: base64Data } }
                            ]
                        }]
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || 'API Call Failed');
                }

                const resultText = data.candidates[0].content.parts[0].text;
                statusBox.classList.add('hidden');
                
                quizOutput.innerHTML = `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 space-y-4">
                        <h2 class="text-2xl font-bold text-cyan-400 border-b border-slate-700 pb-2">${quizTitle}</h2>
                        <div class="whitespace-pre-line text-slate-200">${resultText}</div>
                    </div>
                `;

            } catch (err) {
                statusBox.classList.remove('hidden', 'bg-cyan-900/50', 'border-cyan-500');
                statusBox.classList.add('bg-red-900/50', 'border-red-500');
                statusBox.innerText = 'এরর: ' + err.message;
            } finally {
                genBtn.disabled = false;
                genBtn.innerText = '✨ AI প্রশ্ন তৈরি শুরু করুন';
            }
        }

        function convertToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
